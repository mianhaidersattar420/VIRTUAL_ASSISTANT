<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARIA — Virtual Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&family=Outfit:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-orb"></div>
          <span>ARIA</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Chat
        </button>
      </div>

      <div class="sessions-list" id="sessionsList">
        <div class="sessions-label">Recent</div>
        <!-- sessions injected here -->
      </div>

      <div class="sidebar-footer">
        <div class="api-status" id="apiStatus">
          <span class="status-dot"></span>
          <span class="status-text">Connecting…</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">

      <!-- Top bar -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="session-title" id="sessionTitle">ARIA</span>
        <div class="mode-switch">
          <button class="mode-btn active" id="chatModeBtn" data-mode="chat">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
          </button>
          <button class="mode-btn" id="voiceModeBtn" data-mode="voice">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            Voice
          </button>
        </div>
      </header>

      <!-- Chat Mode -->
      <div class="chat-view" id="chatView">
        <div class="messages-container" id="messagesContainer">
          <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-orb-wrap">
              <div class="welcome-orb">
                <div class="orb-ring r1"></div>
                <div class="orb-ring r2"></div>
                <div class="orb-ring r3"></div>
                <div class="orb-core"></div>
              </div>
            </div>
            <h1>Hello, I'm <span class="aria-name">ARIA</span></h1>
            <p>Your adaptive AI assistant. Ask me anything.</p>
            <div class="suggestions">
              <button class="suggest-chip" onclick="sendSuggestion('What can you help me with?')">What can you do?</button>
              <button class="suggest-chip" onclick="sendSuggestion('Tell me something interesting')">Tell me something interesting</button>
              <button class="suggest-chip" onclick="sendSuggestion('Help me write an email')">Help me write an email</button>
              <button class="suggest-chip" onclick="sendSuggestion('Explain quantum computing simply')">Explain quantum computing</button>
            </div>
          </div>
        </div>

        <div class="input-area">
          <div class="input-wrap">
            <textarea id="chatInput" placeholder="Message ARIA…" rows="1"></textarea>
            <button class="send-btn" id="sendBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <p class="input-hint">ARIA can make mistakes. Consider checking important info.</p>
        </div>
      </div>

      <!-- Voice Mode -->
      <div class="voice-view hidden" id="voiceView">
        <div class="voice-center">
          <div class="siri-orb-container" id="siriOrbContainer">
            <div class="siri-orb" id="siriOrb">
              <canvas id="waveCanvas"></canvas>
              <div class="siri-glow"></div>
            </div>
          </div>

          <div class="voice-status" id="voiceStatus">Tap to speak</div>
          <div class="voice-transcript" id="voiceTranscript"></div>
          <div class="voice-response" id="voiceResponse"></div>

          <div class="voice-controls">
            <button class="voice-mic-btn" id="voiceMicBtn">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="voice-stop-btn hidden" id="voiceStopBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay hidden" id="deleteModal">
    <div class="modal">
      <p>Delete this conversation?</p>
      <div class="modal-actions">
        <button class="modal-cancel" id="modalCancel">Cancel</button>
        <button class="modal-confirm" id="modalConfirm">Delete</button>
      </div>
    </div>
  </div>

  <!-- Config Panel -->
  <div class="config-panel hidden" id="configPanel">
    <div class="config-inner">
      <h2>Configure ARIA</h2>
      <label>Groq API Key</label>
      <input type="password" id="groqKeyInput" placeholder="gsk_…"/>
      <button class="config-save" id="configSave">Save & Connect</button>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
